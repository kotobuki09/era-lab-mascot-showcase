name: Verify and deploy ERA Lab mascot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'kotobuki09/era-lab-mascot-showcase'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated project root
        run: |
          test "${{ github.repository }}" = "kotobuki09/era-lab-mascot-showcase"
          test -f index.html
          test -f src/main.js
          test -d assets/directions
      - name: Verify assets, integrity and JavaScript
        run: |
          node --test tests/verify.mjs tests/engine.test.mjs
          node --check src/main.js
      - name: Assemble isolated static site
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r assets src dist/
          touch dist/.nojekyll
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare sprite builder Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Generate stationary-body page-mascot atlases
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/build_rig.py --source assets --dest dist/assets/rig
          test -s dist/assets/rig/body.webp
          test -s dist/assets/rig/directions.webp
          test -s dist/assets/rig/reactions.webp
          python tests/rig_quality.py dist/assets/rig
      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
