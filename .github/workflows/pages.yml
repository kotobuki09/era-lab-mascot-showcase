name: Verify and deploy ERA Lab mascot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ hashFiles('index.html') != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify assets, integrity and JavaScript
        run: |
          node --test tests/verify.mjs tests/engine.test.mjs
          node --check src/main.js
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
